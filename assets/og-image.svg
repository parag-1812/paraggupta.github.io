<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <radialGradient id="bg" cx="50%" cy="30%" r="80%">
      <stop offset="0%" stop-color="#101838"/>
      <stop offset="60%" stop-color="#05060d"/>
      <stop offset="100%" stop-color="#04050c"/>
    </radialGradient>
    <linearGradient id="name" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="60%" stop-color="#34e2ff"/>
      <stop offset="100%" stop-color="#ff4fd8"/>
    </linearGradient>
    <radialGradient id="sun" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fff3c4"/>
      <stop offset="45%" stop-color="#ff9d2f"/>
      <stop offset="80%" stop-color="#ff5e2b"/>
      <stop offset="100%" stop-color="#ff5e2b" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="earth" cx="35%" cy="30%" r="75%">
      <stop offset="0%" stop-color="#6db8ff"/>
      <stop offset="55%" stop-color="#1f6fd6"/>
      <stop offset="100%" stop-color="#0b3b86"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- stars -->
  <g fill="#cfe0ff">
    <circle cx="120" cy="90" r="2"/><circle cx="300" cy="160" r="1.5"/><circle cx="500" cy="70" r="1.5"/>
    <circle cx="760" cy="120" r="2"/><circle cx="980" cy="80" r="1.5"/><circle cx="1080" cy="200" r="2"/>
    <circle cx="180" cy="300" r="1.5"/><circle cx="90" cy="470" r="2"/><circle cx="340" cy="520" r="1.5"/>
    <circle cx="1120" cy="420" r="1.5"/><circle cx="1040" cy="560" r="2"/><circle cx="640" cy="560" r="1.5"/>
    <circle cx="880" cy="460" r="1.5"/><circle cx="420" cy="360" r="1.5"/>
  </g>

  <!-- sun glow top-left -->
  <circle cx="150" cy="150" r="220" fill="url(#sun)" opacity="0.5"/>
  <circle cx="150" cy="150" r="70" fill="url(#sun)"/>

  <!-- earth bottom-right -->
  <circle cx="1010" cy="470" r="110" fill="url(#earth)"/>
  <ellipse cx="1010" cy="470" rx="165" ry="46" fill="none" stroke="#7fd0ff" stroke-opacity="0.25" stroke-width="2" transform="rotate(-20 1010 470)"/>

  <!-- text -->
  <text x="90" y="300" font-family="Segoe UI, Arial, sans-serif" font-size="96" font-weight="800" fill="url(#name)" letter-spacing="2">PARAG GUPTA</text>
  <text x="94" y="360" font-family="Consolas, monospace" font-size="34" fill="#ffb648" letter-spacing="6">JAVA FULL STACK DEVELOPER</text>
  <text x="94" y="430" font-family="Segoe UI, Arial, sans-serif" font-size="30" fill="#9aa5cc">🚀 A 3D Voyager journey through my portfolio</text>

  <!-- badge -->
  <rect x="94" y="470" width="300" height="46" rx="23" fill="none" stroke="#34e2ff" stroke-opacity="0.4"/>
  <text x="120" y="500" font-family="Consolas, monospace" font-size="18" fill="#34e2ff" letter-spacing="4">VOYAGER · MISSION CONTROL</text>
</svg>
